AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: FitMentor - Modular Serverless Stack in Tel Aviv (il-central-1) (API Gateway + Lambda + DynamoDB + Cognito)

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref FitMentorTableName

Parameters:
  StageName:
    Type: String
    Default: prod

  ResetUrlBase:
    Type: String
    Default: ""

  FitMentorTableName:
    Type: String
    Default: FitMentorData

  AdminEmail:
    Type: String
    Default: admin@example.com

  GoogleApiKey1:
    Type: String
    Default: ""
    NoEcho: true

  GoogleApiKey2:
    Type: String
    Default: ""
    NoEcho: true

  GoogleApiKey3:
    Type: String
    Default: ""
    NoEcho: true

  LabRoleArn:
    Type: String
    Description: IAM Role ARN to use for all Lambdas (Optional)
    Default: ""

Conditions:
  HasLabRoleArn: !Not [!Equals [!Ref LabRoleArn, ""]]

Resources:
  # -----------------------------
  # DynamoDB Table
  # -----------------------------
  FitMentorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref FitMentorTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: UserID
          AttributeType: S
        - AttributeName: DataType
          AttributeType: S
      KeySchema:
        - AttributeName: UserID
          KeyType: HASH
        - AttributeName: DataType
          KeyType: RANGE

  # -----------------------------
  # Default IAM Role (if LabRoleArn is not provided)
  # -----------------------------
  FitMentorLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ["sts:AssumeRole"]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FitMentorBackendAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt FitMentorTable.Arn
              - Effect: Allow
                Action:
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:AdminUserGlobalSignOut
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:ListUsersInGroup
                  - cognito-idp:ListUsers
                  - cognito-idp:SignUp
                  - cognito-idp:ConfirmSignUp
                  - cognito-idp:ForgotPassword
                  - cognito-idp:ConfirmForgotPassword
                  - cognito-idp:ResendConfirmationCode
                Resource: "*"

  # -----------------------------
  # Cognito User Pool & Groups
  # -----------------------------
  FitMentorCognitoCustomMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorCognitoCustomMessage
      CodeUri: ./lambdas/cognito_custom_message/
      Handler: index.handler
      Role: !If [HasLabRoleArn, !Ref LabRoleArn, !GetAtt FitMentorLambdaExecutionRole.Arn]
      Environment:
        Variables:
          RESET_URL_BASE: !Ref ResetUrlBase

  FitMentorUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: FitMentorUserPool
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      LambdaConfig:
        CustomMessage: !GetAtt FitMentorCognitoCustomMessageFunction.Arn
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true

  CognitoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FitMentorCognitoCustomMessageFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt FitMentorUserPool.Arn

  FitMentorUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref FitMentorUserPool
      ClientName: FitMentorAppClient
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  FitMentorAdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      UserPoolId: !Ref FitMentorUserPool
      Description: Administrators group

  FitMentorUsersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Users
      UserPoolId: !Ref FitMentorUserPool
      Description: Regular users group

  # -----------------------------
  # API Gateway REST API
  # -----------------------------
  FitMentorApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: FitMentorApi
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'OPTIONS,POST'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # -----------------------------
  # Lambda Functions
  # -----------------------------
  FitMentorLogicFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorLogic
      CodeUri: ./lambdas/fitmentor_logic/
      Handler: index.handler
      Role: !If [HasLabRoleArn, !Ref LabRoleArn, !GetAtt FitMentorLambdaExecutionRole.Arn]
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref FitMentorUserPool
          COGNITO_CLIENT_ID: !Ref FitMentorUserPoolClient
          ADMIN_EMAIL: !Ref AdminEmail
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref FitMentorApi
            Path: /API
            Method: POST

  FitMentorDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorDashboard
      CodeUri: ./lambdas/fitmentor_dashboard/
      Handler: index.handler
      Role: !If [HasLabRoleArn, !Ref LabRoleArn, !GetAtt FitMentorLambdaExecutionRole.Arn]
      Environment:
        Variables:
          GOOGLE_API_KEY1: !Ref GoogleApiKey1
          GOOGLE_API_KEY2: !Ref GoogleApiKey2
          GOOGLE_API_KEY3: !Ref GoogleApiKey3
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref FitMentorApi
            Path: /Dashboard
            Method: POST

  FitMentorProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorProgress
      CodeUri: ./lambdas/fitmentor_progress/
      Handler: index.handler
      Role: !If [HasLabRoleArn, !Ref LabRoleArn, !GetAtt FitMentorLambdaExecutionRole.Arn]
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref FitMentorApi
            Path: /Progress
            Method: POST

  FitMentorTrainingLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorTrainingLog
      CodeUri: ./lambdas/fitmentor_training_log/
      Handler: index.handler
      Role: !If [HasLabRoleArn, !Ref LabRoleArn, !GetAtt FitMentorLambdaExecutionRole.Arn]
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref FitMentorApi
            Path: /TrainingLog
            Method: POST

Outputs:
  ApiInvokeUrl:
    Description: Base Invoke URL for FitMentor API Gateway
    Value: !Sub "https://${FitMentorApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  UserPoolId:
    Description: FitMentor Cognito User Pool ID
    Value: !Ref FitMentorUserPool
  UserPoolClientId:
    Description: FitMentor Cognito User Pool Client ID
    Value: !Ref FitMentorUserPoolClient
  DynamoDbTableName:
    Description: FitMentor Single DynamoDB Table Name
    Value: !Ref FitMentorTableName
