AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FitMentor AWS Serverless Stack (DynamoDB + Cognito + API Gateway + Lambdas)
Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
    - x86_64
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME:
          Ref: FitMentorTable
Parameters:
  StageName:
    Type: String
    Default: prod
  ResetUrlBase:
    Type: String
    Default: http://localhost:5173
  FitMentorTableName:
    Type: String
    Default: FitMentorData
  GoogleApiKey1:
    Type: String
    Default: ''
    NoEcho: true
  GoogleApiKey2:
    Type: String
    Default: ''
    NoEcho: true
  GoogleApiKey3:
    Type: String
    Default: ''
    NoEcho: true
Resources:
  FitMentorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Ref: FitMentorTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: UserID
        AttributeType: S
      - AttributeName: DataType
        AttributeType: S
      KeySchema:
      - AttributeName: UserID
        KeyType: HASH
      - AttributeName: DataType
        KeyType: RANGE
  FitMentorCognitoCustomMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorCognitoCustomMessage
      CodeUri: s3://fitmentor-deployments-835922063181/a3efb3d930e9403c31eb1527dc8bba47
      Handler: index.handler
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - logs:*
          Resource: '*'
      Environment:
        Variables:
          RESET_URL_BASE:
            Ref: ResetUrlBase
  FitMentorUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: FitMentorUserPool
      AutoVerifiedAttributes:
      - email
      UsernameAttributes:
      - email
      LambdaConfig:
        CustomMessage:
          Fn::GetAtt:
          - FitMentorCognitoCustomMessageFunction
          - Arn
      Schema:
      - Name: email
        Required: true
        Mutable: true
      - Name: name
        Required: false
        Mutable: true
  CognitoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: FitMentorCognitoCustomMessageFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - FitMentorUserPool
        - Arn
  FitMentorUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: FitMentorUserPool
      ClientName: FitMentorAppClient
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      - ALLOW_USER_SRP_AUTH
      - ALLOW_ADMIN_USER_PASSWORD_AUTH
  FitMentorAdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      UserPoolId:
        Ref: FitMentorUserPool
      Description: Administrators group
  FitMentorUsersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Users
      UserPoolId:
        Ref: FitMentorUserPool
      Description: Regular users group
  FitMentorApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: FitMentorApi
      StageName:
        Ref: StageName
      Cors:
        AllowMethods: "'OPTIONS,POST,GET'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
  FitMentorLogicFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorLogic
      CodeUri: s3://fitmentor-deployments-835922063181/a2061912268391b717384aebcf8a0131
      Handler: index.handler
      Policies:
      - AmazonDynamoDBFullAccess
      - AmazonCognitoPowerUser
      Environment:
        Variables:
          COGNITO_USER_POOL_ID:
            Ref: FitMentorUserPool
          COGNITO_CLIENT_ID:
            Ref: FitMentorUserPoolClient
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: FitMentorApi
            Path: /API
            Method: POST
  FitMentorDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorDashboard
      CodeUri: s3://fitmentor-deployments-835922063181/22ac5070aa43c466159a6e20aa7fa371
      Handler: index.handler
      Policies:
      - AmazonDynamoDBFullAccess
      Environment:
        Variables:
          GOOGLE_API_KEY1:
            Ref: GoogleApiKey1
          GOOGLE_API_KEY2:
            Ref: GoogleApiKey2
          GOOGLE_API_KEY3:
            Ref: GoogleApiKey3
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: FitMentorApi
            Path: /Dashboard
            Method: POST
  FitMentorProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorProgress
      CodeUri: s3://fitmentor-deployments-835922063181/0b905c9c6ea7b026845ba2b8f66ab7f4
      Handler: index.handler
      Policies:
      - AmazonDynamoDBFullAccess
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: FitMentorApi
            Path: /Progress
            Method: POST
  FitMentorTrainingLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorTrainingLog
      CodeUri: s3://fitmentor-deployments-835922063181/b97e58184d9eee19233153086441b99c
      Handler: index.handler
      Policies:
      - AmazonDynamoDBFullAccess
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: FitMentorApi
            Path: /TrainingLog
            Method: POST
Outputs:
  ApiInvokeUrl:
    Description: Base Invoke URL for API Gateway
    Value:
      Fn::Sub: https://${FitMentorApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  UserPoolId:
    Description: Cognito User Pool ID
    Value:
      Ref: FitMentorUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value:
      Ref: FitMentorUserPoolClient
  DynamoDbTableName:
    Description: DynamoDB Table Name
    Value:
      Ref: FitMentorTableName
