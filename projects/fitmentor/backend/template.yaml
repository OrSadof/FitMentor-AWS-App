AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FitMentor AWS Serverless Stack (DynamoDB + Cognito + API Gateway + Lambdas)

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref FitMentorTable

Parameters:
  StageName:
    Type: String
    Default: prod
  ResetUrlBase:
    Type: String
    Default: "http://localhost:5173"
  FitMentorTableName:
    Type: String
    Default: FitMentorData
  OpenRouterApiKey:
    Type: String
    Description: OpenRouter API key used exclusively with deepseek/deepseek-v4-flash-0731
    NoEcho: true

Resources:
  # -----------------------------
  # DynamoDB Table
  # -----------------------------
  FitMentorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref FitMentorTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: UserID
          AttributeType: S
        - AttributeName: DataType
          AttributeType: S
      KeySchema:
        - AttributeName: UserID
          KeyType: HASH
        - AttributeName: DataType
          KeyType: RANGE

  # -----------------------------
  # Cognito User Pool
  # -----------------------------
  FitMentorCognitoCustomMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorCognitoCustomMessage
      CodeUri: src/custom-message/
      Handler: index.handler
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          RESET_URL_BASE: !Ref ResetUrlBase

  FitMentorUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: FitMentorUserPool
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      LambdaConfig:
        CustomMessage: !GetAtt FitMentorCognitoCustomMessageFunction.Arn
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true

  CognitoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FitMentorCognitoCustomMessageFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt FitMentorUserPool.Arn

  FitMentorUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref FitMentorUserPool
      ClientName: FitMentorAppClient
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  FitMentorAdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      UserPoolId: !Ref FitMentorUserPool
      Description: Administrators group

  FitMentorUsersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Users
      UserPoolId: !Ref FitMentorUserPool
      Description: Regular users group

  # -----------------------------
  # API Gateway
  # -----------------------------
  FitMentorApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: FitMentorApi
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'OPTIONS,POST,GET'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          FitMentorCognitoAuthorizer:
            UserPoolArn: !GetAtt FitMentorUserPool.Arn

  # -----------------------------
  # Lambda Functions
  # -----------------------------
  FitMentorLogicFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorLogic
      CodeUri: src/logic/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FitMentorTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
              Resource: !GetAtt FitMentorUserPool.Arn
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref FitMentorUserPool
          COGNITO_CLIENT_ID: !Ref FitMentorUserPoolClient
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref FitMentorApi
            Path: /API
            Method: POST
        AdminPost:
          Type: Api
          Properties:
            RestApiId: !Ref FitMentorApi
            Path: /Admin
            Method: POST
            Auth:
              Authorizer: FitMentorCognitoAuthorizer

  FitMentorDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorDashboard
      CodeUri: src/dashboard/
      Handler: index.handler
      Timeout: 180
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FitMentorTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource: !GetAtt FitMentorTable.Arn
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:FitMentorDashboard"
      Environment:
        Variables:
          OPENROUTER_API_KEY: !Ref OpenRouterApiKey
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref FitMentorApi
            Path: /Dashboard
            Method: POST
            Auth:
              Authorizer: FitMentorCognitoAuthorizer

  FitMentorProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorProgress
      CodeUri: src/progress/
      Handler: index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FitMentorTable
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref FitMentorApi
            Path: /Progress
            Method: POST
            Auth:
              Authorizer: FitMentorCognitoAuthorizer

  FitMentorTrainingLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FitMentorTrainingLog
      CodeUri: src/training/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FitMentorTable
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref FitMentorApi
            Path: /TrainingLog
            Method: POST
            Auth:
              Authorizer: FitMentorCognitoAuthorizer

Outputs:
  ApiInvokeUrl:
    Description: Base Invoke URL for API Gateway
    Value: !Sub "https://${FitMentorApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref FitMentorUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref FitMentorUserPoolClient
  DynamoDbTableName:
    Description: DynamoDB Table Name
    Value: !Ref FitMentorTableName
